<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заказа — Adriano Coffee</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Helvetica Neue',Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 20px;">
            <table width="560" cellpadding="0" cellspacing="0"
                   style="background:white;border-radius:12px;overflow:hidden;
                          box-shadow:0 4px 20px rgba(0,0,0,0.1);max-width:560px;">

                <!-- Хедер -->
                <tr>
                    <td style="background:#610303;padding:28px 40px;text-align:center;">
                        <h1 style="margin:0;color:white;font-size:24px;
                                   font-weight:700;letter-spacing:1px;">
                            ADRIANO COFFEE
                        </h1>
                        <p style="margin:6px 0 0;color:rgba(255,255,255,0.7);
                                  font-size:13px;letter-spacing:2px;">
                            ☕ КОФЕЙНЯ
                        </p>
                    </td>
                </tr>

                <!-- Контент -->
                <tr>
                    <td style="padding:36px 40px;">
                        <p style="margin:0 0 6px;font-size:16px;color:#555;">
                            Здравствуйте, <strong style="color:#2c3e50;" th:text="${customerName}">Клиент</strong>!
                        </p>
                        <p style="margin:0 0 28px;font-size:15px;color:#888;">
                            Статус вашего заказа изменился.
                        </p>

                        <!-- Статус блок -->
                        <div th:style="'background:' + ${statusColor} + ';border-radius:10px;padding:24px;text-align:center;margin-bottom:28px;'"
                             style="border-radius:10px;padding:24px;text-align:center;margin-bottom:28px;">
                            <div style="font-size:44px;margin-bottom:10px;" th:text="${statusEmoji}">📦</div>
                            <div style="font-size:20px;font-weight:700;color:white;letter-spacing:0.5px;"
                                 th:text="${statusText}">Статус</div>
                        </div>

                        <!-- Номер заказа -->
                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background:#fdf8f8;border-radius:8px;
                                      border:1.5px solid #e8d0d0;margin-bottom:20px;">
                            <tr>
                                <td style="padding:16px 20px;">
                                    <span style="font-size:12px;color:#aaa;
                                                 text-transform:uppercase;letter-spacing:1px;">
                                        Номер заказа
                                    </span>
                                    <div style="font-size:24px;font-weight:700;
                                                color:#610303;margin-top:4px;"
                                         th:text="'#' + ${orderId}">#0</div>
                                </td>
                                <td style="padding:16px 20px;text-align:right;">
                                    <span style="font-size:12px;color:#aaa;
                                                 text-transform:uppercase;letter-spacing:1px;">
                                        Сумма
                                    </span>
                                    <div style="font-size:18px;font-weight:700;
                                                color:#2c3e50;margin-top:4px;"
                                         th:text="${totalPrice} + ' сом'">0 сом</div>
                                </td>
                            </tr>
                        </table>

                        <!-- Сообщение по статусу -->
                        <p style="margin:0;font-size:14px;color:#888;
                                  line-height:1.6;text-align:center;"
                           th:text="${statusMessage}">
                        </p>
                    </td>
                </tr>

                <!-- Футер -->
                <tr>
                    <td style="background:#f9f9f9;padding:20px 40px;
                               text-align:center;border-top:1px solid #eee;">
                        <p style="margin:0 0 6px;font-size:13px;color:#aaa;">
                            С уважением, команда Adriano Coffee
                        </p>
                        <p style="margin:0;font-size:12px;color:#ccc;">
                            Это автоматическое уведомление, отвечать на него не нужно.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
